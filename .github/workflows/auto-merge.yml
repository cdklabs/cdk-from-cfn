name: auto-merge
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - edited
      - labeled
    branches:
      - main
jobs:
  enableAutoQueue:
    name: "Set AutoQueue on PR #${{ github.event.number }}"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: (github.event.action != 'edited' || github.event.changes.base)
    steps:
      - id: auto-queue-pr
        env:
          GH_TOKEN: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          MERGE_METHOD: ${{ contains(github.event.pull_request.labels.*.name, 'pr/no-squash') && 'merge' || 'squash' }}
        run: gh pr merge --auto "--$MERGE_METHOD" "$PR_NUMBER" --repo "$GH_REPO"
