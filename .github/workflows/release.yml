# .github/workflows/release.yml
# The file name must stay release.yml, npm Trusted Publishing is configured for it.
name: Release

on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 0 * * *

concurrency:
  group: release

permissions:
  contents: read

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Every release is tagged, so the highest vX.Y.Z tag is the current
      # version. If there are no commits after it, there is nothing new to release.
      - name: Determine version
        id: version
        run: |-
          tag=$(git tag --list 'v[0-9]*' --sort=v:refname | tail -n 1)
          if [ -z "$tag" ]; then
            echo "::error::No vX.Y.Z release tag found"
            exit 1
          fi
          current=${tag#v}
          IFS=. read -r major minor _ <<< "$current"
          next="$major.$((minor + 1)).0"
          if [ -z "$(git rev-list -n1 "$tag..HEAD")" ]; then
            echo "No commits since $tag, skipping release"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "Releasing v$next (previous: $tag)"
            echo "release=true" >> $GITHUB_OUTPUT
          fi
          echo "next=$next" >> $GITHUB_OUTPUT

      - name: 🦀 Install Rust
        if: steps.version.outputs.release == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: ⚡ Cache
        if: steps.version.outputs.release == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
            ${{ runner.os }}-cargo

      - name: Install wasm-pack
        if: steps.version.outputs.release == 'true'
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-pack

      - name: Build
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |-
          wasm-pack build --all-features --target=nodejs --out-name=index
          cd pkg && npm pkg set "version=$VERSION"

      - name: Release
        if: steps.version.outputs.release == 'true'
        run: |-
          npm --version
          cd pkg && npm publish --tag latest

      - name: Tag release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |-
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
